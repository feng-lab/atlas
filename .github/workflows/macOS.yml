name: macOS

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'python/atlas_agent/**'
      - 'LICENSE'
      - 'NOTICE'
  create:
    # Runs when a branch or tag is created; jobs are gated to tags (skip branch creates)
  workflow_dispatch:

concurrency:
  # Cancel any in-progress run for the same ref (branch or tag),
  # regardless of commit SHA. For create tag events, use the tag ref.
  group: atlas-${{ github.workflow }}-${{ github.event_name == 'create' && format('refs/tags/{0}', github.event.ref) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Central switch for all triggers: "github" or "self-hosted".
  MACOS_PIPELINE_MODE: github

jobs:
  determine-mode:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'create' || github.ref_type == 'tag' }}
    outputs:
      mode: ${{ steps.set-mode.outputs.mode }}
    steps:
      - id: set-mode
        shell: bash
        run: |
          mode="${MACOS_PIPELINE_MODE}"
          if [ -z "$mode" ]; then
            mode="github"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  github-hosted:
    needs: determine-mode
    if: ${{ needs.determine-mode.outputs.mode == 'github' }}
    permissions:
      contents: write
    uses: ./.github/workflows/macOS-hosted.yml
    secrets: inherit

  self-hosted:
    needs: determine-mode
    if: ${{ needs.determine-mode.outputs.mode == 'self-hosted' }}
    permissions:
      contents: write
    uses: ./.github/workflows/macOS-self-hosted.yml
    secrets: inherit
